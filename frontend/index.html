<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FFE600'/><rect x='10' y='10' width='80' height='80' rx='12' fill='%23121316'/><path d='M35 25 L65 25 L45 52 L65 52 L35 78 L45 52 L25 52 Z' fill='%23FFE600'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipForge — Multi-Engine Compression Platform</title>
    <meta name="description" content="Adaptive multi-engine file compression and image optimization platform built with Huffman, LZW, RLE, and target-size budgeting." />

    <!-- Google Fonts for Premium Neo-Brutalism -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-flash theme script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('zipforge-theme');
          var theme = stored;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
